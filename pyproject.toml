[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adm-to-av3s"
version = "0.1.0"
description = "Object-preserving ADM / WAV + scene to Audio Vivid M4A"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "defusedxml>=0.7.1,<1"]
license = "MIT"

[project.scripts]
adm-to-av3s = "av3s.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
